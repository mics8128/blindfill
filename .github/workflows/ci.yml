name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: npm run lint
      - run: npm test
  android:
    runs-on: ubuntu-latest
    # repository secrets are not passed to pull requests from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Signed companion APK (checked against the pinned certificate)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          BLINDFILL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export BLINDFILL_KEYSTORE="$RUNNER_TEMP/release.p12"
          (umask 077; base64 -d <<<"$KEYSTORE_B64" > "$BLINDFILL_KEYSTORE")
          android/release-apk.sh
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: blindfill-companion-apk
          path: dist/android/blindfill-companion.apk
          if-no-files-found: error
