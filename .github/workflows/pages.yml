# Manual-only deploy of the static landing page in ./site to GitHub Pages.
# Nothing runs automatically: trigger it from the Actions tab once Pages is
# enabled (Settings -> Pages -> Source: GitHub Actions).
name: Pages
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Drop local-only files
        run: rm -rf site/_shots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
