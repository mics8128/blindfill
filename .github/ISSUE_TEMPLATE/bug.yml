name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste passwords, `BW_SESSION`, vault exports or screenshots of filled forms.**
        Security issues: use private vulnerability reporting, not this form.
  - type: input
    id: version
    attributes: { label: blindfill version (`blindfill --version`) }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Node version / OS / backend }
  - type: textarea
    id: what
    attributes: { label: What happened, and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce (use fake data) }
